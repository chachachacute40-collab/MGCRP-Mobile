
name: Build MGCRP Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build MGCRP Mobile
        working-directory: MGCRP_Mobile_Phase1_Updated
        run: gradle assembleDebug

      - name: Upload MGCRP Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: MGCRP-Mobile-debug
          path: MGCRP_Mobile_Phase1_Updated/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
